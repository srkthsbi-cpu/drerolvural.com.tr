name: Fix invisible hamburger dropdown

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-invisible-hamburger.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile nav specificity on every page
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          changed=0
          for p in Path('.').rglob('*.html'):
            if '.git' in p.parts: continue
            t=p.read_text(encoding='utf-8',errors='replace')
            old='header>.ev-global-mobile-nav{display:none!important}'
            new='header>.ev-global-mobile-nav{display:none!important}\n  header>.ev-global-mobile-nav.open{display:flex!important}'
            if old in t and 'header>.ev-global-mobile-nav.open{display:flex!important}' not in t:
              t=t.replace(old,new)
              p.write_text(t,encoding='utf-8')
              changed+=1
          print("Pages fixed:",changed)
          if changed==0: raise SystemExit("No matching mobile-nav specificity rule found")
          PY
      - name: Verify all pages
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          bad=[]
          scanned=0
          for p in Path('.').rglob('*.html'):
            if '.git' in p.parts: continue
            t=p.read_text(encoding='utf-8',errors='replace')
            if 'ev-global-mobile-nav' not in t: continue
            scanned+=1
            if 'header>.ev-global-mobile-nav.open{display:flex!important}' not in t:
              bad.append(str(p))
          print("Menu pages scanned:",scanned)
          print("Pages missing specificity fix:",len(bad))
          if bad:
            print("\n".join(bad[:100]))
            raise SystemExit(1)
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' .github/workflows/fix-invisible-hamburger.yml
          git rm .github/workflows/fix-invisible-hamburger.yml
          git commit -m "Fix invisible mobile hamburger dropdown"
          git push origin main
