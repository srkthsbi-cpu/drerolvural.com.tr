name: Remove footer list elements

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-footer-list-elements.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace footer lists with plain links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          changed=0
          for p in Path('.').rglob('*.html'):
            if '.git' in p.parts:
              continue
            t=p.read_text(encoding='utf-8', errors='replace')
            if 'ev-footer-v2-menu' not in t:
              continue
            old=t
            t=re.sub(r'<ul[^>]*>(.*?)</ul>', r'\1', t, flags=re.S|re.I)
            t=t.replace('<style id="footer-bullet-cleanup">','<style id="footer-bullet-cleanup-v2">')
            css='''<style id="footer-bullet-cleanup-v3">
            .ev-footer-v2-menu,
            .ev-footer-v2-menu ul,
            .ev-footer-v2-menu li{
              list-style:none!important;
              margin:0!important;
              padding:0!important;
            }
            .ev-footer-v2-menu::before,
            .ev-footer-v2-menu::after,
            .ev-footer-v2-menu li::before,
            .ev-footer-v2-menu li::after,
            .ev-footer-v2-menu li::marker{
              content:none!important;
              display:none!important;
            }
            .ev-footer-v2-menu a{
              list-style:none!important;
            }
            </style>'''
            if 'footer-bullet-cleanup-v3' not in t:
              t=t.replace('</head>',css+'</head>',1)
            if t!=old:
              p.write_text(t,encoding='utf-8')
              changed+=1
          print('Pages changed:',changed)
          if changed == 0:
            raise SystemExit('No footer pages changed')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git rm .github/workflows/remove-footer-list-elements.yml
          git commit -m "Remove footer list bullets sitewide"
          git push origin main
