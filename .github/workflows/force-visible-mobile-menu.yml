name: Force visible mobile menu layer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/force-visible-mobile-menu.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixed mobile menu layer to all HTML pages
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          changed=0
          marker='<style id="ev-mobile-menu-visibility-fix">'
          css='''<style id="ev-mobile-menu-visibility-fix">
          @media(max-width:850px){
            header{position:relative!important;z-index:10000!important;overflow:visible!important}
            header>.ev-global-mobile-nav,
            header>.ev-global-mobile-nav.open{
              position:fixed!important;
              top:70px!important;
              left:12px!important;
              right:12px!important;
              width:auto!important;
              display:none!important;
              visibility:visible!important;
              opacity:1!important;
              z-index:2147483647!important;
              background:#fff!important;
              color:#14577f!important;
              border:1px solid #dcebf0!important;
              border-radius:18px!important;
              box-shadow:0 14px 35px rgba(0,80,130,.22)!important;
              max-height:calc(100vh - 84px)!important;
              overflow:auto!important;
            }
            header>.ev-global-mobile-nav.open{
              display:flex!important;
              flex-direction:column!important;
            }
            header>.ev-global-mobile-nav.open a{
              display:block!important;
              visibility:visible!important;
              opacity:1!important;
            }
          }
          @media(max-width:370px){
            header>.ev-global-mobile-nav,
            header>.ev-global-mobile-nav.open{top:62px!important;left:9px!important;right:9px!important;max-height:calc(100vh - 74px)!important}
          }
          </style>'''
          for p in Path('.').rglob('*.html'):
            if '.git' in p.parts: continue
            t=p.read_text(encoding='utf-8',errors='replace')
            if 'class="ev-global-mobile-menu"' not in t: continue
            if marker in t: continue
            t=t.replace('</head>',css+'</head>',1)
            p.write_text(t,encoding='utf-8')
            changed+=1
          print("Pages updated:",changed)
          if changed==0: raise SystemExit("No hamburger pages found")
          PY
      - name: Verify
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          bad=[]
          for p in Path('.').rglob('*.html'):
            if '.git' in p.parts: continue
            t=p.read_text(encoding='utf-8',errors='replace')
            if 'class="ev-global-mobile-menu"' in t and 'ev-mobile-menu-visibility-fix' not in t:
              bad.append(str(p))
          print("Pages missing fix:",len(bad))
          if bad:
            print("\n".join(bad[:50]))
            raise SystemExit(1)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' .github/workflows/force-visible-mobile-menu.yml
          git rm .github/workflows/force-visible-mobile-menu.yml
          git commit -m "Fix mobile hamburger menu visibility layer"
          git push origin main
