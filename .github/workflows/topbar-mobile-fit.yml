name: One-time top bar mobile fit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/topbar-mobile-fit.yml"

permissions:
  contents: write

jobs:
  fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fit top bar on mobile
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          css = """<style id="ev-top-actions-fit-v1">
          @media(max-width:430px){
            header{gap:4px!important;padding-left:12px!important;padding-right:12px!important}
            header img{width:118px!important;max-width:34vw!important}
            header .mobile-nav-toggle{width:38px!important;height:38px!important;min-width:38px!important;flex:0 0 38px!important;font-size:18px!important}
            .ev-top-actions{gap:4px!important}
            .ev-top-actions a{width:36px!important;height:36px!important;min-width:36px!important;min-height:36px!important}
            .ev-top-actions a i{font-size:17px!important}
            .ev-top-actions .ev-top-whatsapp{width:40px!important;height:40px!important;min-width:40px!important;min-height:40px!important}
            .ev-top-actions .ev-top-whatsapp i{font-size:19px!important}
          }
          </style>"""
          marker="ev-top-actions-fit-v1"
          changed=0
          for p in Path(".").rglob("*.html"):
            if ".git" in p.parts: continue
            t=p.read_text(encoding="utf-8",errors="replace")
            if "ev-top-actions-v1" not in t or marker in t: continue
            t=t.replace("</head>", css+"\n</head>",1)
            p.write_text(t,encoding="utf-8")
            changed+=1
          print("Modified HTML pages:",changed)
          if changed==0: raise SystemExit("No matching HTML pages")
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' .github/workflows/topbar-mobile-fit.yml
          git rm .github/workflows/topbar-mobile-fit.yml
          git commit -m "Fit larger top bar actions on small screens"
          git push origin main
