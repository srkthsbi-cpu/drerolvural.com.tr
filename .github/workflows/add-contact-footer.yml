name: Add contact info site-wide

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-contact:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Add phone and Instagram to every HTML footer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          phone = "+90 541 456 93 67"
          phone_href = "tel:+905414569367"
          insta = "tupmidedoktoru"
          insta_href = "https://www.instagram.com/tupmidedoktoru/"

          style = """
          <style id="ev-contact-footer">
            .ev-contact-footer{
              display:flex;
              flex-wrap:wrap;
              justify-content:center;
              align-items:center;
              gap:10px 18px;
              max-width:760px;
              margin:0 auto 18px;
              padding:0 8px;
            }
            .ev-contact-footer a{
              display:inline-flex;
              align-items:center;
              justify-content:center;
              gap:7px;
              min-height:38px;
              padding:8px 14px;
              border:1px solid rgba(255,255,255,.22);
              border-radius:999px;
              color:#fff!important;
              background:rgba(255,255,255,.08);
              text-decoration:none!important;
              font-size:14px;
              line-height:1.3;
              transition:background .2s ease, transform .2s ease;
            }
            .ev-contact-footer a:hover{
              background:rgba(255,255,255,.16);
              transform:translateY(-1px);
            }
            @media screen and (max-width:700px){
              .ev-contact-footer{gap:8px;margin-bottom:16px}
              .ev-contact-footer a{font-size:13px;padding:7px 11px;min-height:36px}
            }
          </style>
          """

          contact = f'''
          <div class="ev-contact-footer" aria-label="İletişim ve Instagram">
            <a href="{phone_href}" aria-label="Telefon: {phone}">☎ {phone}</a>
            <a href="{insta_href}" target="_blank" rel="noopener noreferrer" aria-label="Instagram: @{insta}">Instagram: @{insta}</a>
          </div>
          '''

          changed = 0
          for path in Path(".").rglob("*.html"):
              if any(part in {".git", "node_modules"} for part in path.parts):
                  continue
              text = path.read_text(encoding="utf-8")
              original = text

              # Remove a previous version if this workflow is ever rerun.
              text = re.sub(r'\s*<style id="ev-contact-footer">.*?</style>\s*', '\n', text, flags=re.S)
              text = re.sub(r'\s*<div class="ev-contact-footer"[^>]*>.*?</div>\s*', '\n', text, flags=re.S)

              if "</head>" in text:
                  text = text.replace("</head>", style + "\n</head>", 1)

              if "</footer>" in text:
                  text = text.replace("</footer>", contact + "\n</footer>", 1)
              elif "</body>" in text:
                  text = text.replace("</body>", "<footer>" + contact + "</footer>\n</body>", 1)
              else:
                  text += "\n<footer>" + contact + "</footer>\n"

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed += 1

          print(f"HTML pages updated: {changed}")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git diff --cached --quiet && echo "No changes needed." && exit 0
          git commit -m "Add phone and Instagram contact to all pages"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          rm -f .github/workflows/add-contact-footer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/add-contact-footer.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove one-time contact footer workflow"
          git push
