name: One-time normalize global mobile header

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/normalize-mobile-header.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize every HTML header
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          CSS = r'''<style id="ev-mobile-header-v4">
          .ev-top-actions{
            display:flex!important;
            align-items:center!important;
            justify-content:flex-end!important;
            gap:6px!important;
            margin-left:auto!important;
            flex:0 0 auto!important;
            flex-wrap:nowrap!important;
            white-space:nowrap!important;
          }
          .ev-top-actions a{
            display:inline-flex!important;
            align-items:center!important;
            justify-content:center!important;
            width:40px!important;
            height:40px!important;
            min-width:40px!important;
            min-height:40px!important;
            padding:0!important;
            margin:0!important;
            border-radius:50%!important;
            border:1px solid #d7e8ed!important;
            background:#fff!important;
            color:#14577f!important;
            text-decoration:none!important;
            box-shadow:0 3px 10px rgba(0,80,130,.10)!important;
          }
          .ev-top-actions a i{
            display:inline-flex!important;
            align-items:center!important;
            justify-content:center!important;
            font-size:19px!important;
            line-height:1!important;
          }
          .ev-top-actions .ev-top-whatsapp{
            width:44px!important;
            height:44px!important;
            min-width:44px!important;
            min-height:44px!important;
            background:#35a7bf!important;
            color:#fff!important;
            border-color:#35a7bf!important;
            box-shadow:0 5px 14px rgba(53,167,191,.25)!important;
          }
          .ev-top-actions .ev-top-whatsapp i{font-size:21px!important}
          .ev-global-mobile-menu{
            display:none!important;
            appearance:none!important;
            -webkit-appearance:none!important;
            border:1px solid #d7e8ed!important;
            width:42px!important;
            height:42px!important;
            min-width:42px!important;
            min-height:42px!important;
            flex:0 0 42px!important;
            padding:0!important;
            margin:0 0 0 4px!important;
            border-radius:50%!important;
            background:#fff!important;
            color:#14577f!important;
            align-items:center!important;
            justify-content:center!important;
            font-size:22px!important;
            line-height:1!important;
            cursor:pointer!important;
            box-shadow:0 3px 12px rgba(0,80,130,.10)!important;
          }
          .ev-global-mobile-menu:focus-visible{
            outline:3px solid #82bc00!important;
            outline-offset:3px!important;
          }
          @media(max-width:850px){
            header{
              width:100%!important;
              max-width:100%!important;
              min-width:0!important;
              display:flex!important;
              flex-wrap:nowrap!important;
              align-items:center!important;
              gap:6px!important;
              padding:8px 12px!important;
              overflow:visible!important;
            }
            header .logo{
              flex:0 1 auto!important;
              min-width:0!important;
              margin:0!important;
            }
            header .logo img, header> a:first-child img{
              width:122px!important;
              max-width:30vw!important;
              height:auto!important;
            }
            header .ev-top-actions{
              margin-left:auto!important;
            }
            header .mobile-nav-toggle{
              display:none!important;
            }
            .ev-global-mobile-menu{
              display:inline-flex!important;
            }
            .ev-global-mobile-nav{
              position:absolute!important;
              top:calc(100% + 8px)!important;
              left:12px!important;
              right:12px!important;
              display:none!important;
              flex-direction:column!important;
              gap:3px!important;
              padding:12px!important;
              background:#fff!important;
              border:1px solid #dcebf0!important;
              border-radius:18px!important;
              box-shadow:0 14px 35px rgba(0,80,130,.16)!important;
              max-height:calc(100vh - 90px)!important;
              overflow:auto!important;
              z-index:3000!important;
            }
            .ev-global-mobile-nav.open{display:flex!important}
            .ev-global-mobile-nav a{
              display:block!important;
              width:100%!important;
              padding:11px 13px!important;
              border-radius:11px!important;
              color:#14577f!important;
              font-weight:600!important;
              text-decoration:none!important;
            }
            .ev-global-mobile-nav a:hover{background:#f1f9fb!important}
            .ev-global-mobile-nav .cta{
              margin-top:4px!important;
              text-align:center!important;
              background:#35a7bf!important;
              color:#fff!important;
            }
            header .tools{display:none!important}
            header>.ev-global-mobile-nav{display:none!important}
          }
          @media(max-width:370px){
            header{gap:4px!important;padding-left:9px!important;padding-right:9px!important}
            header .logo img, header> a:first-child img{width:106px!important;max-width:28vw!important}
            .ev-top-actions{gap:4px!important}
            .ev-top-actions a{width:34px!important;height:34px!important;min-width:34px!important;min-height:34px!important}
            .ev-top-actions a i{font-size:17px!important}
            .ev-top-actions .ev-top-whatsapp{width:38px!important;height:38px!important;min-width:38px!important;min-height:38px!important}
            .ev-top-actions .ev-top-whatsapp i{font-size:19px!important}
            .ev-global-mobile-menu{width:38px!important;height:38px!important;min-width:38px!important;min-height:38px!important;font-size:20px!important}
          }
          @media(min-width:851px){
            .ev-global-mobile-menu{display:none!important}
          }
          </style>'''

          LINKS = [
            ("index.html","Anasayfa"),
            ("doktor-erol-vural.html","Doktor Erol Vural"),
            ("tup-mide-ameliyati.html","Tüp Mide"),
            ("obezite-cerrahisi.html","Obezite Cerrahisi"),
            ("gastrik-bypass.html","Gastrik Bypass"),
            ("metabolik-cerrahi.html","Metabolik Cerrahi"),
            ("mide-balonu.html","Mide Balonu"),
            ("mide-botoksu.html","Mide Botoksu"),
            ("revizyon-cerrahisi.html","Revizyon Cerrahisi"),
            ("uzmanindan-bilgiler.html","Uzmanından Bilgiler"),
            ("bilgi-merkezi-yaklasimi.html","Bilgi Merkezi Yaklaşımı"),
          ]

          def prefix_for(p):
              return "../" if len(p.parts)>1 else ""

          def actions(prefix):
              return f'''<div class="ev-top-actions" aria-label="Hızlı bağlantılar">
              <a href="{prefix}index.html" aria-label="Ana sayfa" title="Ana sayfa"><i class="fas fa-house" aria-hidden="true"></i></a>
              <a href="{prefix}doktor-erol-vural.html" aria-label="Doktor Erol Vural" title="Doktor Erol Vural"><i class="fas fa-user-doctor" aria-hidden="true"></i></a>
              <a href="https://www.instagram.com/tupmidedoktoru/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram"><i class="fab fa-instagram" aria-hidden="true"></i></a>
              <a class="ev-top-whatsapp" href="https://wa.me/905414569367" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp" title="WhatsApp"><i class="fab fa-whatsapp" aria-hidden="true"></i></a>
            </div>'''

          def nav(prefix):
              links="".join(f'<a href="{prefix}{u}">{label}</a>' for u,label in LINKS)
              return f'''<nav class="ev-global-mobile-nav" aria-label="Mobil ana menü">{links}<a class="cta" href="https://wa.me/905414569367" target="_blank" rel="noopener noreferrer">WhatsApp</a></nav>'''

          SCRIPT = r'''<script id="ev-mobile-header-v4-script">
          document.addEventListener('DOMContentLoaded',function(){
            document.querySelectorAll('.ev-global-mobile-menu').forEach(function(btn){
              var nav=btn.parentElement.querySelector('.ev-global-mobile-nav');
              if(!nav) return;
              btn.addEventListener('click',function(e){
                e.stopPropagation();
                var open=nav.classList.toggle('open');
                btn.setAttribute('aria-expanded',open?'true':'false');
                btn.setAttribute('aria-label',open?'Menüyü kapat':'Menüyü aç');
                btn.textContent=open?'×':'☰';
              });
              nav.querySelectorAll('a').forEach(function(a){
                a.addEventListener('click',function(){
                  nav.classList.remove('open');
                  btn.setAttribute('aria-expanded','false');
                  btn.setAttribute('aria-label','Menüyü aç');
                  btn.textContent='☰';
                });
              });
              document.addEventListener('click',function(e){
                if(!nav.contains(e.target) && !btn.contains(e.target)){
                  nav.classList.remove('open');
                  btn.setAttribute('aria-expanded','false');
                  btn.setAttribute('aria-label','Menüyü aç');
                  btn.textContent='☰';
                }
              });
            });
          });
          </script>'''

          changed=0
          headers=0
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              t=p.read_text(encoding='utf-8',errors='replace')
              if '<header' not in t.lower() or '</header>' not in t.lower():
                  continue
              headers+=1
              prefix=prefix_for(p)

              # Remove previously injected top action markup and styles.
              t=re.sub(r'\s*<div class="ev-top-actions"[^>]*>[\s\S]*?</div>\s*', '\n', t, flags=re.I)
              t=re.sub(r'\s*<style id="ev-top-actions-v1">[\s\S]*?</style>\s*', '\n', t, flags=re.I)
              t=re.sub(r'\s*<style id="ev-top-actions-fit-v1">[\s\S]*?</style>\s*', '\n', t, flags=re.I)
              t=re.sub(r'\s*<style id="ev-mobile-header-v4">[\s\S]*?</style>\s*', '\n', t, flags=re.I)
              t=re.sub(r'\s*<script id="ev-mobile-header-v4-script">[\s\S]*?</script>\s*', '\n', t, flags=re.I)
              # Remove prior global mobile nav/button if a retry ever happens.
              t=re.sub(r'\s*<button class="ev-global-mobile-menu"[^>]*>[\s\S]*?</button>\s*', '\n', t, flags=re.I)
              t=re.sub(r'\s*<nav class="ev-global-mobile-nav"[^>]*>[\s\S]*?</nav>\s*', '\n', t, flags=re.I)

              header=re.search(r'<header[\s\S]*?</header>',t,re.I)
              if not header: continue
              h=header.group(0)

              # Remove old main-template hamburger; we reinsert it at the far right.
              h=re.sub(r'<button class="mobile-nav-toggle"[^>]*>[\s\S]*?</button>','',h,flags=re.I)
              # Remove article back/tools area on mobile; keep it out of the new unified header.
              h=re.sub(r'<div class="tools">[\s\S]*?</div>','',h,flags=re.I)
              h=re.sub(r'<div class="langbox">[\s\S]*?</div>','',h,flags=re.I)

              # Remove any old nav from the header; desktop main nav stays on main pages by rebuilding it.
              oldnav=re.search(r'<nav class="nav"[^>]*>[\s\S]*?</nav>',h,re.I)
              if oldnav:
                  h=h[:oldnav.start()]+h[oldnav.end():]

              # Determine whether this is a root page or article page from existing header logo href.
              logo_match=re.search(r'<a([^>]*class="logo"[^>]*)>',h,re.I)
              if logo_match:
                  logo_anchor=logo_match.group(0)
                  logo_inner_end=h.find('</a>',logo_match.start())+4
                  logo_block=h[logo_match.start():logo_inner_end]
              else:
                  firsta=re.search(r'<a[^>]*>\s*<img[^>]*logo1\.png[^>]*>\s*</a>',h,re.I)
                  logo_block=firsta.group(0) if firsta else ''

              # Rebuild header from logo + quick actions + mobile hamburger + unified mobile nav.
              if not logo_block:
                  continue
              root=(len(p.parts)==1)
              desktop_nav=''
              if root:
                  # Preserve the existing desktop navigation set from the page's prior source when possible.
                  desktop_nav=f'''<nav class="nav" id="primary-navigation">
                  <a href="{prefix}index.html">Anasayfa</a>
                  <a href="{prefix}doktor-erol-vural.html">Doktor Erol Vural</a>
                  <a href="{prefix}tup-mide-ameliyati.html">Tüp Mide</a>
                  <a href="{prefix}obezite-cerrahisi.html">Obezite Cerrahisi</a>
                  <a href="{prefix}gastrik-bypass.html">Gastrik Bypass</a>
                  <a href="{prefix}metabolik-cerrahi.html">Metabolik Cerrahi</a>
                  <a href="{prefix}mide-balonu.html">Mide Balonu</a>
                  <a href="{prefix}mide-botoksu.html">Mide Botoksu</a>
                  <a href="{prefix}revizyon-cerrahisi.html">Revizyon Cerrahisi</a>
                  <a href="{prefix}uzmanindan-bilgiler.html">Uzmanından Bilgiler</a>
                  <a href="{prefix}bilgi-merkezi-yaklasimi.html">Bilgi Merkezi Yaklaşımı</a>
                  <a class="cta" href="https://wa.me/905414569367" target="_blank" rel="noopener noreferrer">WhatsApp</a>
                  </nav>'''
              newh=f'''<header>{logo_block}{desktop_nav}{actions(prefix)}
              <button class="ev-global-mobile-menu" type="button" aria-expanded="false" aria-label="Menüyü aç">☰</button>
              {nav(prefix)}</header>'''
              t=t[:header.start()]+newh+t[header.end():]

              # Ensure Font Awesome exists.
              if 'cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css' not in t:
                  t=t.replace('</head>','<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">\n</head>',1)
              t=t.replace('</head>',CSS+'\n'+SCRIPT+'\n</head>',1)
              p.write_text(t,encoding='utf-8')
              changed+=1

          print('HTML headers found:',headers)
          print('HTML pages normalized:',changed)
          if changed==0: raise SystemExit('No HTML headers normalized')
          PY

      - name: Verify
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re,sys
          files=list(Path('.').rglob('*.html'))
          bad=[]
          count=0
          for p in files:
            if '.git' in p.parts: continue
            t=p.read_text(encoding='utf-8',errors='replace')
            if '<header' not in t.lower(): continue
            count+=1
            header=re.search(r'<header[\s\S]*?</header>',t,re.I)
            if not header: bad.append(f'{p}: no header'); continue
            h=header.group(0)
            if h.count('class="ev-top-actions"')!=1: bad.append(f'{p}: actions={h.count("class=\"ev-top-actions\"")}')
            if h.count('class="ev-global-mobile-menu"')!=1: bad.append(f'{p}: menu={h.count("class=\"ev-global-mobile-menu\"")}')
            if h.count('class="ev-global-mobile-nav"')!=1: bad.append(f'{p}: nav={h.count("class=\"ev-global-mobile-nav\"")}')
            if 'ev-top-actions-v1' in t or 'ev-top-actions-fit-v1' in t: bad.append(f'{p}: old action css remains')
          print('HTML headers checked:',count)
          print('Problems:',len(bad))
          if bad:
            print('\n'.join(bad[:40]))
            sys.exit(1)
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' .github/workflows/normalize-mobile-header.yml
          git rm .github/workflows/normalize-mobile-header.yml
          git commit -m "Normalize global mobile header and hamburger"
          git push origin main
