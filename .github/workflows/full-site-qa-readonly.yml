name: Full site QA + visual repair

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'data/**'
      - 'site.js'
      - 'blog.js'
      - 'post.js'
      - '.github/workflows/full-site-qa-readonly.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair article-page navigation and visual consistency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pages=sorted(Path('.').rglob('*.html'))
          pages=[p for p in pages if '.git' not in p.parts]
          changed=[]

          css=r'''
<style id="ev-article-nav-v3-style">
.ev-article-nav-toggle{display:none!important;width:42px;height:42px;padding:0;border:0;border-radius:50%;background:#eef8fa;color:#005082;align-items:center;justify-content:center;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 3px 12px rgba(0,80,130,.10)}
.ev-article-nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.ev-article-nav a{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 9px;color:#005082!important;text-decoration:none!important;font-size:12px;font-weight:600;line-height:1.2;border-radius:10px}
.ev-article-nav a:hover{background:#eef8fa;color:#009bb4!important}
.ev-article-nav .ev-nav-cta{padding:9px 14px;color:#fff!important;background:linear-gradient(135deg,#009bb4,#35a9bf);border-radius:999px;box-shadow:0 5px 16px rgba(0,155,180,.18)}
@media(max-width:1100px){
  .ev-article-nav-toggle{display:inline-flex!important}
  .ev-article-nav{position:absolute!important;top:calc(100% + 8px)!important;right:12px!important;left:12px!important;display:none!important;flex-direction:column!important;align-items:stretch!important;gap:4px!important;padding:12px!important;background:#fff!important;border:1px solid #dcebf0!important;border-radius:18px!important;box-shadow:0 14px 35px rgba(0,80,130,.16)!important;max-height:calc(100vh - 90px)!important;overflow:auto!important;z-index:2000!important}
  .ev-article-nav.open{display:flex!important}
  .ev-article-nav a{width:100%!important;justify-content:flex-start!important;padding:11px 13px!important;font-size:14px!important;border-radius:11px!important}
  .ev-article-nav .ev-nav-cta{justify-content:center!important}
}
@media(max-width:700px){
  header{min-height:64px!important;padding:8px 16px!important}
  header img{width:165px!important;max-width:55vw!important}
  .ev-article-nav-toggle{width:40px;height:40px}
}
</style>
'''
          js=r'''
<script id="ev-article-nav-v3-script">
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('.ev-article-nav-toggle').forEach(function(btn){
    var nav=document.getElementById(btn.getAttribute('aria-controls'));
    if(!nav) return;
    function closeNav(){nav.classList.remove('open');btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-label','Menüyü aç');btn.textContent='☰';}
    btn.addEventListener('click',function(e){e.stopPropagation();var open=nav.classList.toggle('open');btn.setAttribute('aria-expanded',open?'true':'false');btn.setAttribute('aria-label',open?'Menüyü kapat':'Menüyü aç');btn.textContent=open?'×':'☰';});
    nav.querySelectorAll('a').forEach(function(a){a.addEventListener('click',closeNav);});
    document.addEventListener('click',function(e){if(!nav.contains(e.target)&&!btn.contains(e.target))closeNav();});
    window.addEventListener('resize',function(){if(window.innerWidth>1100)closeNav();});
  });
});
</script>
'''

          for p in pages:
              s=p.read_text(encoding='utf-8',errors='ignore')
              if 'class="mobile-nav-toggle"' in s or 'id="ev-article-nav-v3-style"' in s:
                  continue
              if '<header' not in s or '</header>' not in s or '<main' not in s or 'class="tools"' not in s:
                  continue
              depth=len(p.parts)-1
              root='../'*depth
              nav_id='ev-article-primary-navigation'
              links=[
                (root+'index.html','Anasayfa'),
                (root+'doktor-erol-vural.html','Doktor Erol Vural'),
                (root+'tup-mide-ameliyati.html','Tüp Mide'),
                (root+'obezite-cerrahisi.html','Obezite Cerrahisi'),
                (root+'uzmanindan-bilgiler.html','Uzmanından Bilgiler'),
                (root+'iletisim.html','İletişim'),
                ('https://wa.me/905414569367','WhatsApp')
              ]
              nav=''.join(f'<a href="{href}"'+(' class="ev-nav-cta" rel="noopener" target="_blank"' if href.startswith('https://wa.me/') else '')+f'>{label}</a>' for href,label in links)
              block=f'<button class="ev-article-nav-toggle" type="button" aria-expanded="false" aria-controls="{nav_id}" aria-label="Menüyü aç">☰</button><nav class="ev-article-nav" id="{nav_id}" aria-label="Ana menü">{nav}</nav>'
              s=s.replace('</header>',block+'</header>',1)
              s=s.replace('</head>',css+js+'</head>',1)
              p.write_text(s,encoding='utf-8')
              changed.append(p.as_posix())

          Path('VISUAL-NAV-V3-REPORT.txt').write_text(
            'GLOBAL VISUAL NAV V3\n=====================\n'
            f'HTML pages scanned: {len(pages)}\n'
            f'Pages standardized with article navigation: {len(changed)}\n\n' +
            '\n'.join(changed),
            encoding='utf-8')
          print(f'Scanned {len(pages)} HTML pages; standardized {len(changed)}.')
          PY

      - name: Static site QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, sys

          files=sorted(Path('.').rglob('*.html'))
          files=[p for p in files if '.git' not in p.parts]
          local=set(p.as_posix() for p in files)
          issues=[]
          e_pages=[]
          duplicate_id_pages=[]
          meta_issues=[]
          menu_issues=[]

          class P(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]; self.links=[]; self.title=False; self.viewport=False; self.canonical=False
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if 'id' in a: self.ids.append(a['id'])
                  if tag=='a' and a.get('href'): self.links.append(a['href'])
                  if tag=='title': self.title=True
                  if tag=='meta' and a.get('name','').lower()=='viewport': self.viewport=True
                  if tag=='link' and a.get('rel')=='canonical': self.canonical=True

          for p in files:
              text=p.read_text(encoding='utf-8',errors='ignore')
              if re.search(r'<p[^>]*>\s*e\s*</p>',text,re.I): e_pages.append(p.as_posix())
              parser=P(); parser.feed(text)
              dups={x for x in parser.ids if parser.ids.count(x)>1}
              if dups: duplicate_id_pages.append((p.as_posix(),sorted(dups)))
              if not parser.title or not parser.viewport or not parser.canonical: meta_issues.append(p.as_posix())
              if 'mobile-nav-toggle' in text and 'ev-mobile-menu-v3-script' not in text and 'site.js' not in text: menu_issues.append(p.as_posix())
              base=p.parent
              for href in parser.links:
                  if href.startswith(('http://','https://','mailto:','tel:','#','javascript:')): continue
                  target=href.split('#')[0].split('?')[0]
                  if not target: continue
                  dest=(base/target).resolve()
                  try: rel=dest.relative_to(Path('.').resolve()).as_posix()
                  except ValueError: continue
                  if not dest.exists() and rel not in local: issues.append((p.as_posix(),href))

          report=['FULL SITE QA (READ-ONLY)','========================',f'HTML pages scanned: {len(files)}',f'Broken local links: {len(issues)}',f'Duplicate ID pages: {len(duplicate_id_pages)}',f'Missing title/viewport/canonical: {len(meta_issues)}',f'Standalone e pages: {len(e_pages)}',f'Potential mobile-menu wiring issues: {len(menu_issues)}','']
          report += ['BROKEN LINKS:']+[f'{a} -> {b}' for a,b in issues]+['','DUPLICATE IDS:']+[f'{a}: {b}' for a,b in duplicate_id_pages]+['','MISSING CORE META:']+meta_issues+['','STANDALONE E:']+e_pages+['','MOBILE MENU:']+menu_issues
          Path('SITE-FULL-QA-REPORT.txt').write_text('\n'.join(report),encoding='utf-8')
          print('\n'.join(report))
          if issues or duplicate_id_pages or meta_issues or e_pages or menu_issues:
              sys.exit(1)
          PY
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-full-qa-report
          path: SITE-FULL-QA-REPORT.txt

      - name: Commit visual repairs and QA report
        if: always()
        shell: bash
        run: |
          git config user.name "srkthsbi-cpu"
          git config user.email "srkthsbi@gmail.com"
          git add '*.html' SITE-FULL-QA-REPORT.txt VISUAL-NAV-V3-REPORT.txt
          if git diff --cached --quiet; then
            echo "No visual or QA file changes to commit."
            exit 0
          fi
          git commit -m "Repair global visual navigation and site QA"
          git push
