name: Full site QA (read-only)

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'data/**'
      - 'site.js'
      - 'blog.js'
      - 'post.js'
      - '.github/workflows/full-site-qa-readonly.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: One-time canonical URL repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          files=sorted(p for p in Path('.').rglob('*.html') if '.git' not in p.parts)
          changed=0
          for p in files:
              s=p.read_text(encoding='utf-8',errors='replace')
              original=s
              s=re.sub(r'https://drerolvural\.com\.tr/([^\s"<>]+)\.html(?=["#?])',lambda m:'https://drerolvural.com.tr/'+m.group(1),s)
              s=re.sub(r'(href=["\'])(?!https?://|mailto:|tel:|#)([^"\']+)\.html([#?"\'])',lambda m:m.group(1)+m.group(2)+m.group(3),s)
              if s!=original:
                  p.write_text(s,encoding='utf-8'); changed+=1
          urls=[]
          for p in files:
              rel=p.as_posix()
              urls.append('https://drerolvural.com.tr/' if rel=='index.html' else 'https://drerolvural.com.tr/'+rel[:-5])
          urls=sorted(set(urls))
          root=ET.Element('urlset',{'xmlns':'http://www.sitemaps.org/schemas/sitemap/0.9'})
          for u in urls:
              x=ET.SubElement(root,'url'); ET.SubElement(x,'loc').text=u
          ET.ElementTree(root).write('sitemap.xml',encoding='utf-8',xml_declaration=True)
          r=Path('_redirects')
          if r.exists():
              text=r.read_text(encoding='utf-8')
              replacements={
                '/blog/tupe-mide-ameliyati-nedir.html /blog/tup-mide-ameliyati-nedir.html':'/blog/tupe-mide-ameliyati-nedir.html /blog/tup-mide-ameliyati-nedir',
                '/blog/tupe-mide-ameliyati-sonrasi.html /blog/tup-mide-ameliyati-sonrasi.html':'/blog/tupe-mide-ameliyati-sonrasi.html /blog/tup-mide-ameliyati-sonrasi',
                '/blog/tupe-mide-kimler-icin-uygun.html /blog/tup-mide-ameliyati-kimlere-uygulanir.html':'/blog/tupe-mide-kimler-icin-uygun.html /blog/tup-mide-ameliyati-kimlere-uygulanir',
                '/blog/tupe-mide-riskleri.html /blog/tup-mide-riskleri-ve-komplikasyonlari.html':'/blog/tupe-mide-riskleri.html /blog/tup-mide-riskleri-ve-komplikasyonlari',
                '/blog/metabolik-cerrahi-tip2-diyabet.html /blog/metabolik-cerrahi-tip-2-diyabet.html':'/blog/metabolik-cerrahi-tip2-diyabet.html /blog/metabolik-cerrahi-tip-2-diyabet'}
              for a,b in replacements.items(): text=text.replace(a,b)
              r.write_text(text,encoding='utf-8')
          print(f'Canonical clean-URL repair changed {changed} HTML files; sitemap={len(urls)} URLs')
          PY
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/full-site-qa-readonly.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('permissions:\n  contents: write','permissions:\n  contents: read',1)
          start=s.index('      - name: One-time canonical URL repair\n')
          end=s.index('      - name: Static site QA\n',start)
          s=s[:start]+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply canonical clean URL repair [skip ci]'
          git push
      - name: Static site QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, sys

          files=sorted(Path('.').rglob('*.html'))
          files=[p for p in files if '.git' not in p.parts]
          local=set(p.as_posix() for p in files)
          issues=[]
          e_pages=[]
          duplicate_id_pages=[]
          meta_issues=[]
          menu_issues=[]

          class P(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]; self.links=[]; self.title=False; self.viewport=False; self.canonical=False
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if 'id' in a: self.ids.append(a['id'])
                  if tag=='a' and a.get('href'): self.links.append(a['href'])
                  if tag=='title': self.title=True
                  if tag=='meta' and a.get('name','').lower()=='viewport': self.viewport=True
                  if tag=='link' and a.get('rel')=='canonical': self.canonical=True

          for p in files:
              text=p.read_text(encoding='utf-8',errors='ignore')
              if re.search(r'<p[^>]*>\s*e\s*</p>',text,re.I): e_pages.append(p.as_posix())
              parser=P(); parser.feed(text)
              dups={x for x in parser.ids if parser.ids.count(x)>1}
              if dups: duplicate_id_pages.append((p.as_posix(),sorted(dups)))
              if not parser.title or not parser.viewport or not parser.canonical: meta_issues.append(p.as_posix())
              if 'mobile-nav-toggle' in text and 'ev-mobile-menu-v3-script' not in text and 'site.js' not in text: menu_issues.append(p.as_posix())
              base=p.parent
              for href in parser.links:
                  if href.startswith(('http://','https://','mailto:','tel:','#','javascript:')): continue
                  target=href.split('#')[0].split('?')[0]
                  if not target: continue
                  dest=(base/target).resolve()
                  try: rel=dest.relative_to(Path('.').resolve()).as_posix()
                  except ValueError: continue
                  if not dest.exists() and rel not in local: issues.append((p.as_posix(),href))

          report=['FULL SITE QA (READ-ONLY)','========================',f'HTML pages scanned: {len(files)}',f'Broken local links: {len(issues)}',f'Duplicate ID pages: {len(duplicate_id_pages)}',f'Missing title/viewport/canonical: {len(meta_issues)}',f'Standalone e pages: {len(e_pages)}',f'Potential mobile-menu wiring issues: {len(menu_issues)}','']
          report += ['BROKEN LINKS:']+[f'{a} -> {b}' for a,b in issues]+['','DUPLICATE IDS:']+[f'{a}: {b}' for a,b in duplicate_id_pages]+['','MISSING CORE META:']+meta_issues+['','STANDALONE E:']+e_pages+['','MOBILE MENU:']+menu_issues
          Path('SITE-FULL-QA-REPORT.txt').write_text('\n'.join(report),encoding='utf-8')
          print('\n'.join(report))
          if issues or duplicate_id_pages or meta_issues or e_pages or menu_issues:
              sys.exit(1)
          PY
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-full-qa-report
          path: SITE-FULL-QA-REPORT.txt
