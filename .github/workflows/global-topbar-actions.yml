name: One-time global top bar actions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/global-topbar-actions.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply global top bar actions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          marker = "ev-top-actions-v1"
          css = r'''
          <style id="ev-top-actions-v1">
          .ev-top-actions{
            display:none;
            align-items:center;
            justify-content:center;
            gap:8px;
            margin-left:auto;
            flex:0 0 auto;
          }
          .ev-top-actions a{
            display:inline-flex!important;
            align-items:center!important;
            justify-content:center!important;
            width:44px!important;
            height:44px!important;
            min-width:44px!important;
            min-height:44px!important;
            padding:0!important;
            border-radius:50%!important;
            border:1px solid #d7e8ed!important;
            background:#fff!important;
            color:#14577f!important;
            text-decoration:none!important;
            box-shadow:0 4px 12px rgba(0,80,130,.10)!important;
            transition:transform .18s ease,box-shadow .18s ease,background .18s ease!important;
          }
          .ev-top-actions a i{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            font-size:20px!important;
            line-height:1!important;
          }
          .ev-top-actions a:hover{
            transform:translateY(-1px) scale(1.03);
            background:#f2fafc!important;
            box-shadow:0 7px 18px rgba(0,80,130,.15)!important;
          }
          .ev-top-actions .ev-top-whatsapp{
            width:48px!important;
            height:48px!important;
            min-width:48px!important;
            min-height:48px!important;
            background:#35a7bf!important;
            color:#fff!important;
            border-color:#35a7bf!important;
            box-shadow:0 6px 18px rgba(53,167,191,.28)!important;
          }
          .ev-top-actions .ev-top-whatsapp i{font-size:22px!important}
          @media(max-width:850px){
            .ev-top-actions{display:flex!important}
            header{gap:8px!important}
            header .mobile-nav-toggle{width:44px!important;height:44px!important;min-width:44px!important;flex:0 0 44px}
            header .mobile-nav-toggle + .nav + .ev-top-actions{margin-left:auto}
          }
          @media(max-width:430px){
            .ev-top-actions{gap:5px}
            .ev-top-actions a{width:40px!important;height:40px!important;min-width:40px!important;min-height:40px!important}
            .ev-top-actions a i{font-size:18px!important}
            .ev-top-actions .ev-top-whatsapp{width:44px!important;height:44px!important;min-width:44px!important;min-height:44px!important}
            .ev-top-actions .ev-top-whatsapp i{font-size:20px!important}
          }
          @media(min-width:851px){
            body[data-page="blog-post"] .ev-top-actions{display:flex!important}
            body[data-page="blog-post"] header{gap:16px!important}
          }
          </style>
          '''

          def depth_prefix(path):
              return "../" if len(path.parts) > 1 else ""

          changed = 0
          for path in Path(".").rglob("*.html"):
              if ".git" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              if marker in text:
                  continue
              if "</header>" not in text.lower():
                  continue

              prefix = depth_prefix(path)
              actions = f'''<div class="ev-top-actions" aria-label="Hızlı bağlantılar">
                <a href="{prefix}index.html" aria-label="Ana sayfa" title="Ana sayfa"><i class="fas fa-house" aria-hidden="true"></i></a>
                <a href="{prefix}doktor-erol-vural.html" aria-label="Doktor Erol Vural" title="Doktor Erol Vural"><i class="fas fa-user-doctor" aria-hidden="true"></i></a>
                <a href="https://www.instagram.com/tupmidedoktoru/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram"><i class="fab fa-instagram" aria-hidden="true"></i></a>
                <a class="ev-top-whatsapp" href="https://wa.me/905414569367" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp" title="WhatsApp"><i class="fab fa-whatsapp" aria-hidden="true"></i></a>
              </div>'''

              new = re.sub(r'</header>', actions + '\n</header>', text, count=1, flags=re.I)
              if new == text:
                  continue

              # Keep the existing mobile hamburger; on main-template pages the quick actions sit after it.
              if '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">' not in new:
                  new = new.replace('</head>', '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">\n' + css + '\n</head>', 1)
              else:
                  new = new.replace('</head>', css + '\n</head>', 1)

              path.write_text(new, encoding="utf-8")
              changed += 1

          print(f"Modified HTML pages: {changed}")
          PY

      - name: Verify
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, sys
          files = list(Path(".").rglob("*.html"))
          with_actions = 0
          bad = []
          for p in files:
              t = p.read_text(encoding="utf-8", errors="replace")
              if "ev-top-actions-v1" in t:
                  with_actions += 1
                  if t.count("class=\"ev-top-actions\"") != 1:
                      bad.append(str(p))
          print(f"HTML pages: {len(files)}")
          print(f"Pages with top actions: {with_actions}")
          if bad:
              print("Bad pages:")
              print("\n".join(bad))
              sys.exit(1)
          if with_actions == 0:
              sys.exit("No pages were modified.")
          PY

      - name: Commit changes and remove one-time workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' .github/workflows/global-topbar-actions.yml
          git rm .github/workflows/global-topbar-actions.yml
          git commit -m "Add larger global top bar quick actions"
          git push origin main
