name: Footer bullets
on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "blog/*.html"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c "from pathlib import Path; css='<style>.ev-footer-v2-menu ul,.ev-footer-v2-menu li{list-style:none!important;margin:0!important;padding:0!important}.ev-footer-v2-menu li::marker{content:none!important}</style>'; [(p.write_text(p.read_text(encoding='utf-8').replace('</head>',css+'</head>',1),encoding='utf-8')) for p in Path('.').rglob('*.html') if 'ev-footer-v2-menu' in p.read_text(encoding='utf-8') and 'li::marker{content:none!important}' not in p.read_text(encoding='utf-8')]"
