name: Portalize mobile menu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/portalize-mobile-menu.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace mobile menu runtime with body portal
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          changed=0
          script=re.compile(r'<script id="ev-mobile-header-v4-script">.*?</script>',re.S)
          new='''<script id="ev-mobile-header-v4-script">
          document.addEventListener('DOMContentLoaded',function(){
            document.querySelectorAll('.ev-global-mobile-menu').forEach(function(btn){
              var nav=btn.parentElement.querySelector('.ev-global-mobile-nav');
              if(!nav) return;
              var portal=document.createElement('div');
              portal.className='ev-mobile-menu-portal';
              portal.innerHTML=nav.innerHTML;
              portal.setAttribute('aria-hidden','true');
              document.body.appendChild(portal);
              nav.remove();
              function close(){
                portal.classList.remove('open');
                portal.setAttribute('aria-hidden','true');
                btn.setAttribute('aria-expanded','false');
                btn.setAttribute('aria-label','Menüyü aç');
                btn.textContent='☰';
              }
              btn.addEventListener('click',function(e){
                e.preventDefault(); e.stopPropagation();
                var open=portal.classList.toggle('open');
                portal.setAttribute('aria-hidden',open?'false':'true');
                btn.setAttribute('aria-expanded',open?'true':'false');
                btn.setAttribute('aria-label',open?'Menüyü kapat':'Menüyü aç');
                btn.textContent=open?'×':'☰';
              });
              portal.addEventListener('click',function(e){
                var a=e.target.closest('a');
                if(a) close();
              });
              document.addEventListener('click',function(e){
                if(!portal.contains(e.target) && !btn.contains(e.target)) close();
              });
              window.addEventListener('resize',function(){ if(window.innerWidth>850) close(); });
            });
          });
          </script>'''
          css='''<style id="ev-mobile-menu-portal-css">
          .ev-mobile-menu-portal{display:none!important}
          @media(max-width:850px){
            .ev-mobile-menu-portal{
              display:none!important;
              position:fixed!important;
              top:70px!important;
              left:10px!important;
              right:10px!important;
              width:auto!important;
              max-height:calc(100vh - 82px)!important;
              overflow-y:auto!important;
              padding:12px!important;
              flex-direction:column!important;
              gap:3px!important;
              background:#fff!important;
              border:1px solid #dcebf0!important;
              border-radius:18px!important;
              box-shadow:0 18px 45px rgba(0,0,0,.25)!important;
              z-index:2147483647!important;
              box-sizing:border-box!important;
            }
            .ev-mobile-menu-portal.open{display:flex!important}
            .ev-mobile-menu-portal a{
              display:block!important;
              width:100%!important;
              box-sizing:border-box!important;
              padding:13px 14px!important;
              color:#14577f!important;
              background:#fff!important;
              border-radius:11px!important;
              text-decoration:none!important;
              font-weight:600!important;
              visibility:visible!important;
              opacity:1!important;
            }
            .ev-mobile-menu-portal a:hover{background:#f1f9fb!important}
            .ev-mobile-menu-portal .cta{
              margin-top:5px!important;
              text-align:center!important;
              background:#35a7bf!important;
              color:#fff!important;
            }
          }
          @media(max-width:370px){
            .ev-mobile-menu-portal{top:62px!important;left:8px!important;right:8px!important;max-height:calc(100vh - 74px)!important}
          }
          </style>'''
          for p in Path('.').rglob('*.html'):
            if '.git' in p.parts: continue
            t=p.read_text(encoding='utf-8',errors='replace')
            if 'class="ev-global-mobile-menu"' not in t: continue
            t=script.sub(new,t,count=1)
            if 'ev-mobile-menu-portal-css' not in t:
              t=t.replace('</head>',css+'</head>',1)
            p.write_text(t,encoding='utf-8')
            changed+=1
          print("Portalized:",changed)
          if changed==0: raise SystemExit("No hamburger pages")
          PY
      - name: Verify
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          bad=[]
          for p in Path('.').rglob('*.html'):
            if '.git' in p.parts: continue
            t=p.read_text(encoding='utf-8',errors='replace')
            if 'class="ev-global-mobile-menu"' in t and ('ev-mobile-menu-portal' not in t or 'portal.classList.toggle' not in t):
              bad.append(str(p))
          print("Pages missing portal:",len(bad))
          if bad: raise SystemExit(1)
          PY
      - name: Commit and remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' .github/workflows/portalize-mobile-menu.yml
          git rm .github/workflows/portalize-mobile-menu.yml
          git commit -m "Portalize mobile hamburger menu"
          git push origin main
