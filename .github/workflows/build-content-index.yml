name: Build content index

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/content-index.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site content index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          import json, re, hashlib
          from datetime import datetime, timezone

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title=[]
                  self.h1=[]
                  self.headings=[]
                  self.meta={}
                  self.canonical=""
                  self.links=[]
                  self.text=[]
                  self.in_title=False
                  self.in_h1=False
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=="title": self.in_title=True
                  if tag=="h1": self.in_h1=True
                  if tag in ("h2","h3"): self.headings.append([])
                  if tag=="meta" and a.get("name"):
                      self.meta[a.get("name","").lower()]=a.get("content","")
                  if tag=="link" and a.get("rel")=="canonical":
                      self.canonical=a.get("href","")
                  if tag=="a" and a.get("href"):
                      self.links.append(a["href"])
              def handle_endtag(self, tag):
                  if tag=="title": self.in_title=False
                  if tag=="h1": self.in_h1=False
              def handle_data(self, data):
                  if self.in_title: self.title.append(data)
                  if self.in_h1: self.h1.append(data)
                  self.text.append(data)

          entries=[]
          for p in sorted(Path(".").rglob("*.html")):
              if ".git" in p.parts or "node_modules" in p.parts:
                  continue
              raw=p.read_text(encoding="utf-8",errors="ignore")
              q=Parser()
              try: q.feed(raw)
              except Exception: pass
              clean=re.sub(r"\s+"," "," ".join(q.text)).strip()
              headings=[re.sub(r"\s+"," "," ".join(h)).strip() for h in q.headings if h]
              external=[]
              for href in q.links:
                  if href.startswith(("http://","https://")):
                      host=urlparse(href).netloc.lower()
                      if host and "drerolvural.com.tr" not in host:
                          external.append(href)
              entries.append({
                  "url": "/" + p.as_posix(),
                  "title": re.sub(r"\s+"," "," ".join(q.title)).strip(),
                  "h1": re.sub(r"\s+"," "," ".join(q.h1)).strip(),
                  "meta_description": q.meta.get("description",""),
                  "canonical": q.canonical,
                  "word_count": len(clean.split()),
                  "headings": headings[:40],
                  "has_faq": bool(re.search(r"faq|sık sorulan|sıkça sorulan", clean, re.I)),
                  "external_sources": sorted(set(external))[:30],
                  "content_hash": hashlib.sha256(raw.encode("utf-8")).hexdigest()
              })

          out={
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "page_count": len(entries),
              "entries": entries
          }
          Path("data").mkdir(exist_ok=True)
          Path("data/content-index.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print("Indexed HTML pages:", len(entries))
          PY

      - name: Commit content index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content-index.json
          git diff --cached --quiet && exit 0
          git commit -m "Update site content index"
          git push
