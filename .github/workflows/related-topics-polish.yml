name: Global related topics polish

on:
  push:
    branches: [main]
    paths:
      - '**.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: related-topics-polish
  cancel-in-progress: true

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Style related topics on every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css = r'''<style id="ev-related-topics-v1">
          /* Global related-topics card/list design */
          .related{
            margin:42px 0 0!important;
            padding:26px!important;
            background:linear-gradient(180deg,#f8fcfd 0%,#ffffff 100%)!important;
            border:1px solid #dcebf0!important;
            border-radius:20px!important;
            box-shadow:0 8px 28px rgba(0,80,130,.07)!important;
          }
          .related h2{
            margin:0 0 18px!important;
            color:#005082!important;
            font-size:25px!important;
            line-height:1.3!important;
          }
          .related ul{
            list-style:none!important;
            margin:0!important;
            padding:0!important;
            display:grid!important;
            grid-template-columns:repeat(2,minmax(0,1fr))!important;
            gap:12px!important;
          }
          .related li{
            margin:0!important;
            padding:0!important;
          }
          .related a{
            display:flex!important;
            align-items:center!important;
            min-height:54px;
            width:100%;
            padding:12px 15px!important;
            border:1px solid #d6e9ef!important;
            border-radius:14px!important;
            background:#fff!important;
            color:#005082!important;
            text-decoration:none!important;
            font-size:15px!important;
            font-weight:600!important;
            line-height:1.4!important;
            box-shadow:0 3px 12px rgba(0,80,130,.045)!important;
            transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease!important;
          }
          .related a::before{
            content:"→";
            flex:0 0 auto;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            width:28px;
            height:28px;
            margin-right:10px;
            border-radius:50%;
            background:#eaf7f9;
            color:#009bb4;
            font-weight:700;
          }
          .related a:hover{
            transform:translateY(-2px);
            border-color:#009bb4!important;
            background:#f8fdfe!important;
            box-shadow:0 8px 20px rgba(0,155,180,.12)!important;
          }
          @media(max-width:700px){
            .related{
              margin:32px 0 0!important;
              padding:18px!important;
              border-radius:17px!important;
            }
            .related h2{
              font-size:22px!important;
              margin-bottom:14px!important;
            }
            .related ul{
              grid-template-columns:1fr!important;
              gap:9px!important;
            }
            .related a{
              min-height:50px;
              padding:11px 12px!important;
              font-size:14px!important;
              border-radius:13px!important;
            }
            .related a::before{
              width:25px;
              height:25px;
              margin-right:9px;
            }
          }
          </style>'''

          files=[p for p in Path('.').rglob('*.html') if '.git' not in p.parts and 'node_modules' not in p.parts]
          changed=0
          for p in files:
              s=p.read_text(encoding='utf-8',errors='ignore')
              original=s
              s=re.sub(r'<style\s+id="ev-related-topics-v1">.*?</style>','',s,flags=re.I|re.S)
              if re.search(r'<section[^>]*class="related"',s,re.I):
                  s=s.replace('</head>',css+'</head>',1)
                  changed += (s!=original)
                  p.write_text(s,encoding='utf-8')
          print("HTML scanned:",len(files))
          print("HTML pages updated:",changed)

          # One-time workflow: remove itself in the same commit so it cannot loop.
          wf=Path('.github/workflows/related-topics-polish.yml')
          if wf.exists():
              wf.unlink()
          PY

      - name: Commit all changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Polish related topics cards site-wide"
          git pull --rebase origin main
          git push
