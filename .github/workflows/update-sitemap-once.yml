name: Update sitemap after new SEO publications
on:
  push:
    branches: [main]
    paths:
      - 'blog/*.html'
      - '.github/workflows/update-sitemap-once.yml'
permissions:
  contents: write
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild sitemap from canonical HTML URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from datetime import date
          import xml.etree.ElementTree as ET

          BASE='https://drerolvural.com.tr/'
          today=str(date.today())
          urls={}
          class P(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  if tag!='link': return
                  a=dict(attrs)
                  if a.get('rel')=='canonical' and a.get('href','').startswith(BASE):
                      urls[a['href']]=1
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              try:
                  P().feed(p.read_text(encoding='utf-8'))
              except Exception:
                  pass
          # Keep only canonical URLs found in actual HTML and add core pages that may use non-canonical templates.
          core=['index.html','doktor-erol-vural.html','gastrik-bypass.html','metabolik-cerrahi.html','mide-balonu.html','mide-botoksu.html','obezite-cerrahisi.html','obezite-tedavisi.html','revizyon-cerrahisi.html','tup-mide-ameliyati.html','uzmanindan-bilgiler.html','bilgi-merkezi-yaklasimi.html']
          for f in core:
              p=Path(f)
              if p.exists(): urls.setdefault(BASE+f,today)
          # Normalize trailing root URL.
          if BASE+'index.html' in urls:
              urls[BASE]=1
              del urls[BASE+'index.html']
          root=ET.Element('urlset',{'xmlns':'http://www.sitemaps.org/schemas/sitemap/0.9'})
          for u in sorted(urls):
              x=ET.SubElement(root,'url'); ET.SubElement(x,'loc').text=u; ET.SubElement(x,'lastmod').text=today
          ET.ElementTree(root).write('sitemap.xml',encoding='utf-8',xml_declaration=True)
          print(f'Generated sitemap with {len(urls)} URLs')
          PY
      - name: Commit sitemap and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          git rm .github/workflows/update-sitemap-once.yml
          git commit -m 'Update sitemap for new SEO publications' || exit 0
          git push
