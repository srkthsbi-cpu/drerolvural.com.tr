name: Standardize footer sitewide

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/standardize-footer.yml"

permissions:
  contents: write

jobs:
  footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move and standardize footer on every page
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          footer=re.compile(r'<footer\b[\s\S]*?</footer>',re.I)
          css='''<style id="ev-sitewide-footer-v2">
          footer.ev-sitewide-footer{
            margin-top:0!important;
            width:100%!important;
            box-sizing:border-box!important;
            background:linear-gradient(180deg,#0b6f9d 0%,#07567f 100%)!important;
            color:#fff!important;
            border-top:4px solid #25a8c5!important;
            padding:30px 18px 24px!important;
            text-align:center!important;
          }
          .ev-footer-v2-inner{max-width:1180px;margin:0 auto}
          .ev-footer-v2-menu{
            display:flex!important;
            flex-wrap:wrap!important;
            justify-content:center!important;
            gap:8px 10px!important;
            margin:0 auto 24px!important;
            padding:0!important;
            list-style:none!important;
          }
          .ev-footer-v2-menu a{
            display:inline-flex!important;
            align-items:center!important;
            justify-content:center!important;
            padding:8px 11px!important;
            border:1px solid rgba(255,255,255,.22)!important;
            border-radius:999px!important;
            color:#fff!important;
            background:rgba(255,255,255,.08)!important;
            text-decoration:none!important;
            font-size:12px!important;
            line-height:1.2!important;
            font-weight:600!important;
          }
          .ev-footer-v2-menu a:hover{background:rgba(255,255,255,.17)!important}
          .ev-footer-v2-logo{
            display:block!important;
            width:190px!important;
            max-width:55vw!important;
            height:auto!important;
            margin:0 auto 13px!important;
          }
          .ev-footer-v2-copy{margin:0 auto 14px!important;max-width:720px!important;color:rgba(255,255,255,.86)!important;font-size:11px!important;line-height:1.5!important}
          .ev-footer-v2-social{display:flex!important;justify-content:center!important;align-items:center!important;gap:8px!important;flex-wrap:wrap!important}
          .ev-footer-v2-social a{
            display:inline-flex!important;
            align-items:center!important;
            gap:6px!important;
            padding:8px 12px!important;
            border:1px solid rgba(255,255,255,.28)!important;
            border-radius:999px!important;
            color:#fff!important;
            background:rgba(255,255,255,.10)!important;
            text-decoration:none!important;
            font-size:11px!important;
            font-weight:600!important;
          }
          .ev-footer-v2-social i{font-size:13px!important}
          @media(max-width:600px){
            footer.ev-sitewide-footer{padding:26px 10px 20px!important}
            .ev-footer-v2-menu{gap:7px 6px!important;margin-bottom:22px!important}
            .ev-footer-v2-menu a{font-size:11px!important;padding:8px 9px!important}
            .ev-footer-v2-logo{width:175px!important}
            .ev-footer-v2-social a{font-size:10px!important;padding:7px 10px!important}
          }
          </style>'''
          links=[
            ("Anasayfa","index.html"),("Doktor Erol Vural","doktor-erol-vural.html"),
            ("Tüp Mide","tup-mide-ameliyati.html"),("Obezite Cerrahisi","obezite-cerrahisi.html"),
            ("Gastrik Bypass","gastrik-bypass.html"),("Metabolik Cerrahi","metabolik-cerrahi.html"),
            ("Mide Balonu","mide-balonu.html"),("Mide Botoksu","mide-botoksu.html"),
            ("Revizyon Cerrahisi","revizyon-cerrahisi.html"),("Uzmanından Bilgiler","uzmanindan-bilgiler.html"),
            ("Bilgi Merkezi","bilgi-merkezi-yaklasimi.html")
          ]
          def rel_for(p,target):
            # target is repo-root relative; compute relative href from page directory
            import posixpath
            base=posixpath.dirname(str(p))
            return posixpath.relpath(target,base or ".")
          def make_footer(p):
            items="".join(f'<li><a href="{rel_for(p,t)}">{label}</a></li>' for label,t in links)
            return f'''<footer class="ev-sitewide-footer">
            <div class="ev-footer-v2-inner">
              <nav class="ev-footer-v2-menu" aria-label="Site menüsü"><ul style="display:contents">{items}</ul></nav>
              <a href="{rel_for(p,"index.html")}" aria-label="Doç. Dr. Erol Vural ana sayfa">
                <img class="ev-footer-v2-logo" alt="Doç. Dr. Erol Vural | Metabolik ve Bariatrik Cerrahi" src="{rel_for(p,"logo2.png")}" loading="lazy" decoding="async">
              </a>
              <p class="ev-footer-v2-copy">© 2026 Doç. Dr. Erol VURAL | Metabolik ve Bariatrik Cerrahi. Tüm hakları saklıdır.</p>
              <div class="ev-footer-v2-social" aria-label="İletişim ve sosyal medya">
                <a href="https://www.instagram.com/tupmidedoktoru/" target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram" aria-hidden="true"></i><span>Instagram</span></a>
                <a href="https://wa.me/905414569367" target="_blank" rel="noopener noreferrer"><i class="fab fa-whatsapp" aria-hidden="true"></i><span>WhatsApp</span></a>
                <a href="tel:+905414569367"><i class="fas fa-phone" aria-hidden="true"></i><span>+90 541 456 93 67</span></a>
              </div>
            </div>
          </footer>'''
          changed=0
          for p in Path('.').rglob('*.html'):
            if '.git' in p.parts: continue
            t=p.read_text(encoding='utf-8',errors='replace')
            if '<body' not in t.lower() or '</body>' not in t.lower(): continue
            # remove every existing footer, regardless of where it was inserted
            t2=footer.sub('',t)
            # remove prior footer CSS so this version is authoritative
            t2=re.sub(r'<style id="ev-sitewide-footer-v2">[\s\S]*?</style>','',t2,flags=re.I)
            f=make_footer(p)
            t2=t2.replace('</head>',css+'</head>',1) if '</head>' in t2.lower() else t2
            t2=re.sub(r'</body>',f+'</body>',t2,count=1,flags=re.I)
            p.write_text(t2,encoding='utf-8')
            changed+=1
          print("Pages standardized:",changed)
          if changed<1000: raise SystemExit(f"Unexpected page count: {changed}")
          PY
      - name: Verify footer placement
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          bad=[]
          count=0
          for p in Path('.').rglob('*.html'):
            if '.git' in p.parts: continue
            t=p.read_text(encoding='utf-8',errors='replace')
            if 'ev-sitewide-footer' not in t: continue
            count+=1
            if t.lower().find('<footer') > t.lower().find('</main>') if '</main>' in t.lower() else False:
              pass
            # footer must be the final body element
            body=t[t.lower().find('<body'):t.lower().rfind('</body>')]
            if body.lower().rfind('<footer') < body.lower().rfind('<')-2000:
              pass
            if body.count('ev-sitewide-footer') != 1:
              bad.append(str(p))
          print("Standardized footer pages:",count)
          print("Bad footer counts:",len(bad))
          if bad: raise SystemExit(1)
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' .github/workflows/standardize-footer.yml
          git rm .github/workflows/standardize-footer.yml
          git commit -m "Standardize footer menu and social links sitewide"
          git push origin main
