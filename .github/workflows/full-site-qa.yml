name: Full site QA and repair

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'data/**'
      - 'site.js'
      - 'blog.js'
      - 'post.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-site-qa-main
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit and repair all HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse, unquote
          import re, hashlib

          root=Path('.')
          files=[p for p in root.rglob('*.html') if '.git' not in p.parts and 'node_modules' not in p.parts]
          html_set={p.as_posix() for p in files}
          changed=[]
          stray_e=[]
          menu_fixed=0
          toggle_added=0
          link_errors=[]
          image_errors=[]
          missing_meta=[]
          duplicate_ids=[]

          MOBILE_CSS = r'''
          <style id="ev-mobile-menu-v3">
          .mobile-nav-toggle{
            display:none!important;
            appearance:none;
            -webkit-appearance:none;
            border:0;
            width:42px;
            height:42px;
            padding:0;
            border-radius:50%;
            background:#eef8fa;
            color:#005082;
            align-items:center;
            justify-content:center;
            font-size:20px;
            line-height:1;
            cursor:pointer;
            box-shadow:0 3px 12px rgba(0,80,130,.10);
          }
          .nav.open{display:flex!important}
          @media(max-width:850px){
            header{position:sticky!important}
            .mobile-nav-toggle{display:inline-flex!important}
            .nav{
              position:absolute!important;
              top:calc(100% + 8px)!important;
              left:12px!important;
              right:12px!important;
              display:none!important;
              flex-direction:column!important;
              align-items:stretch!important;
              gap:4px!important;
              padding:12px!important;
              background:#fff!important;
              border:1px solid #dcebf0!important;
              border-radius:18px!important;
              box-shadow:0 14px 35px rgba(0,80,130,.16)!important;
              max-height:calc(100vh - 90px)!important;
              overflow:auto!important;
              z-index:2000!important;
            }
            .nav.open{display:flex!important}
            .nav a{
              display:block!important;
              width:100%!important;
              padding:11px 13px!important;
              border-radius:11px!important;
              font-size:14px!important;
            }
            .nav a:hover{background:#f1f9fb!important}
            .nav .cta{margin-top:4px;text-align:center!important}
          }
          </style>'''

          MOBILE_JS = r'''
          <script id="ev-mobile-menu-v3">
          document.addEventListener('DOMContentLoaded',function(){
            document.querySelectorAll('.mobile-nav-toggle').forEach(function(btn){
              var nav=document.getElementById(btn.getAttribute('aria-controls')) || document.querySelector('.nav');
              if(!nav) return;
              btn.addEventListener('click',function(){
                var open=nav.classList.toggle('open');
                btn.setAttribute('aria-expanded',open?'true':'false');
                btn.setAttribute('aria-label',open?'Menüyü kapat':'Menüyü aç');
                btn.textContent=open?'×':'☰';
              });
              nav.querySelectorAll('a').forEach(function(a){
                a.addEventListener('click',function(){
                  nav.classList.remove('open');
                  btn.setAttribute('aria-expanded','false');
                  btn.setAttribute('aria-label','Menüyü aç');
                  btn.textContent='☰';
                });
              });
              document.addEventListener('click',function(e){
                if(!nav.contains(e.target) && !btn.contains(e.target)){
                  nav.classList.remove('open');
                  btn.setAttribute('aria-expanded','false');
                  btn.setAttribute('aria-label','Menüyü aç');
                  btn.textContent='☰';
                }
              });
            });
          });
          </script>'''

          def resolve_local(page, raw):
              u=unquote(raw.split('#',1)[0].split('?',1)[0])
              if not u or u.startswith(('#','mailto:','tel:','javascript:','data:')): return None
              if u.startswith(('http://','https://','//')):
                  return None
              target=(page.parent / u).resolve()
              try: target.relative_to(root.resolve())
              except ValueError: return None
              return target

          class IDParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if 'id' in d: self.ids.append(d['id'])

          for p in files:
              s=p.read_text(encoding='utf-8',errors='ignore')
              orig=s

              # Normalize the mobile menu marker IDs: style and script must have unique IDs.
              s=re.sub(r'<style\s+id="ev-mobile-menu-v3">', '<style id="ev-mobile-menu-v3-style">', s, flags=re.I)
              s=re.sub(r'<script\s+id="ev-mobile-menu-v3">', '<script id="ev-mobile-menu-v3-script">', s, flags=re.I)

              # Remove accidental placeholder hero/content paragraphs.
              n=re.sub(r'<p>\s*e\s*</p>', '', s, flags=re.I)
              if n!=s:
                  stray_e.append(p.as_posix())
                  s=n

              # Ensure every page with a .nav has a working mobile toggle.
              has_nav=bool(re.search(r'<nav\b[^>]*class=["\'][^"\']*\bnav\b',s,re.I))
              has_toggle='mobile-nav-toggle' in s
              if has_nav and not has_toggle:
                  m=re.search(r'(<nav\b[^>]*class=["\'][^"\']*\bnav\b[^>]*>)',s,re.I)
                  if m:
                      btn='<button class="mobile-nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" aria-label="Menüyü aç">☰</button>'
                      s=s[:m.start()]+btn+m.group(1)+s[m.end():]
                      toggle_added+=1

              # Make sure toggle has the expected accessible attributes.
              s=re.sub(r'<button([^>]*class=["\'][^"\']*mobile-nav-toggle[^"\']*["\'][^>]*)>',
                       lambda m: '<button'+re.sub(r'\saria-expanded=["\'][^"\']*["\']','',re.sub(r'\saria-controls=["\'][^"\']*["\']','',re.sub(r'\saria-label=["\'][^"\']*["\']','',m.group(1))) )+' aria-expanded="false" aria-controls="primary-navigation" aria-label="Menüyü aç">', s, flags=re.I)

              if has_nav and 'ev-mobile-menu-v3-style' not in s:
                  s=s.replace('</head>', MOBILE_CSS+'\n'+MOBILE_JS+'\n</head>',1)
                  menu_fixed+=1

              # Add an id to nav if missing so aria-controls is reliable.
              s=re.sub(r'<nav(?![^>]*\bid=["\'])', '<nav id="primary-navigation"', s, count=1, flags=re.I)

              if s!=orig:
                  p.write_text(s,encoding='utf-8')
                  changed.append(p.as_posix())

          # Second pass: validate links, images and duplicate IDs after repairs.
          for p in files:
              s=p.read_text(encoding='utf-8',errors='ignore')
              for raw in re.findall(r'\b(?:href|src)=["\']([^"\']+)["\']',s,re.I):
                  target=resolve_local(p,raw)
                  if target is None: continue
                  if raw.split('#',1)[0] and not target.exists():
                      if raw.lower().endswith(('.png','.jpg','.jpeg','.webp','.svg','.gif','.ico')):
                          image_errors.append(f'{p.as_posix()} -> {raw}')
                      else:
                          link_errors.append(f'{p.as_posix()} -> {raw}')
              parser=IDParser()
              parser.feed(s)
              seen=set()
              dup=[]
              for i in parser.ids:
                  if i in seen: dup.append(i)
                  seen.add(i)
              if dup: duplicate_ids.append(f'{p.as_posix()}: {", ".join(sorted(set(dup)))}')

              if '<meta name="viewport"' not in s.lower(): missing_meta.append(f'{p.as_posix()}: viewport')
              if '<title>' not in s.lower(): missing_meta.append(f'{p.as_posix()}: title')
              if 'rel="canonical"' not in s.lower(): missing_meta.append(f'{p.as_posix()}: canonical')

          report=[
            'FULL SITE QA REPORT',
            '===================',
            f'HTML pages scanned: {len(files)}',
            f'HTML pages modified: {len(changed)}',
            f'Pages with accidental standalone <p>e</p> removed: {len(stray_e)}',
            f'Pages receiving/repairing mobile menu: {menu_fixed}',
            f'Missing mobile toggles inserted: {toggle_added}',
            f'Broken local HTML/document links remaining: {len(link_errors)}',
            f'Broken local image links remaining: {len(image_errors)}',
            f'Duplicate HTML ids: {len(duplicate_ids)}',
            f'Missing core meta checks: {len(missing_meta)}',
            '',
            'BROKEN LINKS:',
            *link_errors[:500],
            '',
            'BROKEN IMAGES:',
            *image_errors[:500],
            '',
            'DUPLICATE IDS:',
            *duplicate_ids[:500],
            '',
            'MISSING CORE META:',
            *missing_meta[:500],
            '',
            'PLACEHOLDER E CLEANUP:',
            *stray_e[:500],
          ]
          Path('SITE-FULL-QA-REPORT.txt').write_text('\n'.join(report)+'\n',encoding='utf-8')
          print('\n'.join(report[:12]))
          if link_errors or image_errors or missing_meta:
              print('QA found remaining issues; report written for follow-up.')
          PY

      - name: Commit repairs and QA report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Full site QA: repair mobile navigation and visible UI issues"
          git pull --rebase origin main
          git push
