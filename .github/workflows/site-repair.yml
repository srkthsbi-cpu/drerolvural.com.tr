name: Site-wide mobile and link repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit and repair all HTML pages
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import posixpath, re

          root = Path(".")
          html_paths = sorted(p for p in root.rglob("*.html") if ".git" not in p.parts)
          html_set = {p.as_posix() for p in html_paths}

          legacy = {
              "/blog/tupe-mide-ameliyati-nedir.html": "/blog/tup-mide-ameliyati-nedir.html",
              "/blog/tupe-mide-ameliyati-sonrasi.html": "/blog/tup-mide-ameliyati-sonrasi.html",
              "/blog/tupe-mide-kimler-icin-uygun.html": "/blog/tup-mide-ameliyati-kimlere-uygulanir.html",
              "/blog/tupe-mide-riskleri.html": "/blog/tup-mide-riskleri-ve-komplikasyonlari.html",
              "/blog/metabolik-cerrahi-tip2-diyabet.html": "/blog/metabolik-cerrahi-tip-2-diyabet.html",
          }

          redirects = {}
          rp = root / "_redirects"
          if rp.exists():
              for line in rp.read_text(encoding="utf-8", errors="replace").splitlines():
                  s = line.strip()
                  if not s or s.startswith("#"):
                      continue
                  parts = s.split()
                  if len(parts) >= 2 and parts[0].startswith("/"):
                      redirects[parts[0]] = parts[1]

          legacy.update(redirects)

          mobile_css = """<style id="ev-sitewide-mobile-fix">
          html{width:100%;max-width:100%;overflow-x:hidden}
          body{width:100%;max-width:100%;min-width:0;overflow-x:hidden}
          img,picture,video,iframe,svg{max-width:100%}
          @media screen and (max-width:700px){
            header{width:100%;max-width:100%;box-sizing:border-box}
            main,.article,.wrap,.hero-inner,.section,.article-content{box-sizing:border-box;max-width:100%!important;width:100%!important;min-width:0!important}
            main,.section{padding-left:16px!important;padding-right:16px!important}
            .article{padding-left:0!important;padding-right:0!important}
            .hero{padding-left:16px!important;padding-right:16px!important}
            h1,h2,h3,p,li,a{overflow-wrap:anywhere;word-break:normal}
            img,picture,video,iframe{height:auto}
          }
          </style>"""

          def resolve_target(page, href):
              raw = href.strip()
              if not raw or raw.startswith("#"):
                  return None
              parts = urlsplit(raw)
              if parts.scheme or parts.netloc:
                  return None
              path = parts.path
              if not path:
                  return None
              if path.startswith("/"):
                  return posixpath.normpath(path.lstrip("/"))
              return posixpath.normpath(posixpath.join(page.parent.as_posix(), path))

          def target_exists(t):
              if not t:
                  return True
              if t in html_set or t in {x.as_posix() for x in root.rglob("*") if x.is_file()}:
                  return True
              if t.endswith("/") and (t + "index.html") in html_set:
                  return True
              if t.endswith(".html") and t[:-5] in html_set:
                  return True
              return False

          updated = 0
          href_repairs = [0]
          missing_before = []
          missing_after = []
          viewport_added = 0
          mobile_fix_added = 0

          href_re = re.compile(r'(?P<prefix>\b(?:href|src)\s*=\s*)(?P<q>["\'])(?P<url>[^"\']+)(?P=q)', re.I)

          for p in html_paths:
              original = p.read_text(encoding="utf-8", errors="replace")
              text = original

              # Normalize/add viewport so every page uses a mobile-safe layout viewport.
              vp = re.compile(r'<meta\s+[^>]*name=["\']viewport["\'][^>]*>', re.I)
              if vp.search(text):
                  text = vp.sub('<meta name="viewport" content="width=device-width,initial-scale=1">', text, count=1)
              else:
                  text = re.sub(r'(<head\b[^>]*>)', r'\1<meta name="viewport" content="width=device-width,initial-scale=1">', text, count=1, flags=re.I)
                  viewport_added += 1

              def repl(m):
                  url = m.group("url")
                  parts = urlsplit(url)
                  if parts.scheme or parts.netloc or url.startswith("#"):
                      return m.group(0)

                  # First repair exact legacy/redirect targets by site-root path.
                  current_target = resolve_target(p, url)
                  root_target = "/" + current_target if current_target else url
                  root_target = root_target.split("#",1)[0].split("?",1)[0]
                  if root_target in legacy:
                      dest = legacy[root_target]
                      # Preserve query/fragment.
                      suffix = ""
                      if parts.query: suffix += "?" + parts.query
                      if parts.fragment: suffix += "#" + parts.fragment
                      # Convert destination back to the current page's relative path.
                      dest_path = dest.lstrip("/")
                      rel = posixpath.relpath(dest_path, start=p.parent.as_posix())
                      if rel == ".": rel = ""
                      new_url = rel + suffix
                      if new_url != url:
                          href_repairs[0] += 1
                          return m.group("prefix")+m.group("q")+new_url+m.group("q")
                      return m.group(0)

                  if current_target and not target_exists(current_target):
                      missing_before.append((p.as_posix(), url, current_target))
                  return m.group(0)

              text = href_re.sub(repl, text)

              if 'id="ev-sitewide-mobile-fix"' not in text:
                  if re.search(r'</head\s*>', text, re.I):
                      text = re.sub(r'</head\s*>', mobile_css + '</head>', text, count=1, flags=re.I)
                      mobile_fix_added += 1

              if text != original:
                  p.write_text(text, encoding="utf-8", newline="\n")
                  updated += 1

          # Re-scan all internal links after repairs.
          for p in html_paths:
              text = p.read_text(encoding="utf-8", errors="replace")
              for m in href_re.finditer(text):
                  url = m.group("url")
                  parts = urlsplit(url)
                  if parts.scheme or parts.netloc or url.startswith("#"):
                      continue
                  t = resolve_target(p, url)
                  if t and not target_exists(t):
                      missing_after.append((p.as_posix(), url, t))

          report = []
          report.append("DREROLVURAL.COM.TR SITE-WIDE QA / REPAIR")
          report.append("="*60)
          report.append(f"HTML pages scanned: {len(html_paths)}")
          report.append(f"HTML pages modified: {updated}")
          report.append(f"Internal links repaired via redirect/legacy mapping: {href_repairs[0]}")
          report.append(f"Pages receiving mobile layout fix: {mobile_fix_added}")
          report.append(f"Pages missing viewport before normalization: {viewport_added}")
          report.append(f"Missing internal links remaining after repair: {len(missing_after)}")
          report.append("")
          if missing_after:
              report.append("UNRESOLVED INTERNAL LINKS")
              for a,b,c in missing_after:
                  report.append(f"- {a} -> {b} (resolved: {c})")
          else:
              report.append("RESULT: No unresolved relative/internal links remain in the scanned HTML.")
          report.append("")
          report.append("The repair intentionally did not rewrite article text or SEO metadata.")
          report.append("It normalized the mobile viewport, added a site-wide mobile CSS safeguard, and replaced internal links that pointed at known legacy redirect targets.")
          (root/"SITE-QA-REPORT.txt").write_text("\n".join(report)+"\n", encoding="utf-8")

          print("\n".join(report))
          PY

      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "srkthsbi-cpu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/site-repair.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Repair mobile layout and internal links site-wide"
          git push
