name: Global logo and footer polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply global responsive logo footer styling
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          root=Path(".")
          css="""<style id="ev-global-footer-polish">
          header img{
            display:block;
            width:185px!important;
            height:auto!important;
            max-width:100%!important;
            max-height:none!important;
            object-fit:contain;
          }
          footer{
            margin-top:48px!important;
            padding:42px 20px 28px!important;
            background:linear-gradient(180deg,#075786 0%,#005082 100%)!important;
            border-top:4px solid #009bb4;
            box-shadow:0 -8px 28px rgba(0,80,130,.08);
          }
          footer>a{
            display:block;
            width:100%;
            max-width:900px;
            margin:0 auto;
            text-decoration:none;
          }
          footer img{
            display:block!important;
            width:240px!important;
            height:auto!important;
            max-width:78%!important;
            max-height:none!important;
            object-fit:contain;
            margin:0 auto 20px!important;
            filter:brightness(0) invert(1);
          }
          footer p{
            max-width:760px;
            margin:0 auto!important;
            padding-top:18px;
            border-top:1px solid rgba(255,255,255,.22);
            font-size:13px!important;
            line-height:1.7;
            letter-spacing:.1px;
            opacity:.92;
          }
          .tags{
            display:flex!important;
            flex-wrap:wrap!important;
            gap:9px 10px!important;
            align-items:center;
            margin-top:12px;
          }
          .tags .tag{
            display:inline-flex!important;
            align-items:center;
            justify-content:center;
            margin:0!important;
            padding:7px 12px!important;
            border-radius:999px;
            background:#eef8fa;
            border:1px solid #cfe8ee;
            color:#005082!important;
            text-decoration:none;
            line-height:1.35;
            font-size:14px;
          }
          .tags .tag:hover{background:#e2f3f6}
          @media screen and (max-width:700px){
            header img{width:165px!important}
            footer{margin-top:38px!important;padding:34px 16px 24px!important}
            footer img{width:210px!important;max-width:72%!important;margin-bottom:18px!important}
            footer p{font-size:12px!important}
            .tags{gap:8px!important}
            .tags .tag{font-size:13px;padding:7px 10px!important}
          }
          </style>"""
          changed=0
          for p in root.rglob("*.html"):
            if ".git" in p.parts: continue
            s=p.read_text(encoding="utf-8",errors="replace")
            old=s
            if 'id="ev-global-footer-polish"' not in s:
              s=re.sub(r'</head\s*>',css+'</head>',s,count=1,flags=re.I)
            # Normalize explicit logo dimensions without changing image assets.
            s=re.sub(r'(<footer[^>]*>\s*<a[^>]*>\s*<img\b[^>]*?)\s+width="[^"]+"\s+height="[^"]+"',r'\1',s,count=1,flags=re.I)
            s=re.sub(r'(<header[^>]*>\s*<a[^>]*>\s*<img\b[^>]*?)\s+width="[^"]+"\s+height="[^"]+"',r'\1',s,count=1,flags=re.I)
            if s!=old:
              p.write_text(s,encoding="utf-8",newline="\n")
              changed+=1
          print(f"Pages polished: {changed}")
          PY
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/global-logo-footer-polish.yml
          git config user.name "srkthsbi-cpu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish logos footer and mobile related links site-wide"
          git push
